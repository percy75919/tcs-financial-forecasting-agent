services:
  mysql:
    image: mysql:8.0
    container_name: tcs-forecast-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tcs_forecast
      MYSQL_USER: tcs_user
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
